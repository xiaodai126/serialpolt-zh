# =============================================================================
# SerialPlot 中文汉化版 —— GitHub Actions 一键构建 (Windows 可执行文件)
#
# 作用：无需在本机安装 Qt，把本仓库推到 GitHub 后，在 Actions 页面点
#       "Run workflow" 即可自动编译并产出 serialplot-zh_CN-portable（含 exe +
#       Qt 运行库 + 中文翻译），解压即用。
#
# 下载方式（二选一，均自动完成）：
#   * GitHub Release：构建后自动发布，从仓库 "Releases" 页面下载 zip。
#   * Gitee 下载站（可选）：若在 GitHub 仓库 Settings -> Secrets 中配置了
#     GITEE_TOKEN 与 GITEE_REPO，本工作流会把同一个 zip 同步上传到你的
#     Gitee 仓库 Release，国内下载更快。未配置则自动跳过，不影响构建。
#
# 关键约束（已在本工作流内处理）：
#   * 项目把 Qwt 静态库名写死为 libqwt.a —— 必须用 MinGW，不能用 MSVC。
#   * Qt6 的 MinGW 预编译包【不含 qtsvg 模块】，而 serialplot 用到了
#     QSvgGenerator（SVG 导出），因此本工作流会从源码编译并安装 QtSvg。
#   * Qwt 在编译时由 CMake 自动从 SourceForge 下载并编译（需联网）。
#   * 汉化翻译 serialplot_zh_CN.qm 与 Qt 自带中文 qtbase_zh_CN.qm 已随仓库提交。
#
# 使用步骤：
#   1. 把本仓库推到你自己的 GitHub 仓库（main 或 master 分支）
#   2. 进入仓库的 Actions -> "Build Windows (中文汉化版)" -> Run workflow
#   3. 运行结束后：GitHub 上从 "Releases" 下载；若已配置 Gitee，也去 Gitee 下载
# =============================================================================
name: Build Windows (中文汉化版)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# 发布 GitHub Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Python (aqtinstall 需要)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 aqtinstall
        run: python -m pip install --upgrade aqtinstall

      - name: 安装 Qt6 (MinGW) + 编译器 + CMake
        # Qt6 的 MinGW 预编译包不含 qtsvg，qtsvg 在后续步骤从源码编译
        run: |
          aqt install-qt windows desktop 6.8.0 win64_mingw -m qtserialport -O C:/Qt
          aqt install-tool windows desktop tools_mingw1310 -O C:/Qt
          aqt install-tool windows desktop tools_cmake -O C:/Qt

      - name: 从源码编译并安装 QtSvg (MinGW 预编译包不含此模块)
        shell: bash
        run: |
          set -e
          export PATH="/c/Qt/6.8.0/mingw_64/bin:/c/Qt/Tools/mingw1310_64/bin:$PATH"
          URLS=(
            "https://download.qt.io/official_releases/qt/6.8/6.8.0/submodules/qtsvg-everywhere-src-6.8.0.tar.xz"
            "https://mirrors.tuna.tsinghua.edu.cn/qt/official_releases/qt/6.8/6.8.0/submodules/qtsvg-everywhere-src-6.8.0.tar.xz"
          )
          OK=0
          for u in "${URLS[@]}"; do
            echo "尝试下载 qtsvg 源码: $u"
            if curl -L --retry 3 --retry-all-errors -o qtsvg.tar.xz "$u"; then OK=1; break; fi
          done
          if [ "$OK" != "1" ]; then echo "qtsvg 源码下载失败"; exit 1; fi
          tar xf qtsvg.tar.xz
          cd qtsvg-everywhere-src-6.8.0
          qmake6 qtsvg.pro
          mingw32-make -j"$(nproc 2>/dev/null || echo 4)"
          mingw32-make install
          echo "校验 Qt6Svg 是否安装成功 ..."
          test -f /c/Qt/6.8.0/mingw_64/lib/cmake/Qt6Svg/Qt6SvgConfig.cmake && echo "Qt6Svg OK" || { echo "Qt6Svg 未安装"; exit 1; }

      - name: 配置并编译 serialplot (MinGW, 自动下载编译 Qwt)
        shell: bash
        run: |
          set -e
          export PATH="/c/Qt/6.8.0/mingw_64/bin:/c/Qt/Tools/mingw1310_64/bin:/c/Qt/Tools/CMake_64/bin:$PATH"
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_QWT=ON
          cmake --build build --config Release -j"$(nproc 2>/dev/null || echo 4)"

      - name: 部署并打包 (windeployqt + 翻译 + 压缩 zip)
        shell: bash
        run: |
          set -e
          export PATH="/c/Qt/6.8.0/mingw_64/bin:$PATH"
          mkdir -p dist/translations
          windeployqt build/serialplot.exe --dir dist --release
          cp translations/serialplot_zh_CN.qm dist/translations/
          cp translations/qtbase_zh_CN.qm dist/translations/
          cp build/serialplot.exe dist/
          echo "打包内容：" && ls -R dist | head -40
          # 生成可分发的 zip（供 Release / Gitee 上传）
          python -c "import shutil; shutil.make_archive('serialplot-zh_CN-portable', 'zip', 'dist')"
          ls -l serialplot-zh_CN-portable.zip

      - name: 上传产物 (Artifacts 兜底)
        uses: actions/upload-artifact@v4
        with:
          name: serialplot-zh_CN-portable
          path: serialplot-zh_CN-portable.zip

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zh-build-${{ github.run_number }}
          name: SerialPlot 中文汉化版 v0.13.0 (build ${{ github.run_number }})
          body: |
            由 GitHub Actions 自动构建的 SerialPlot 中文汉化版。

            - 含 serialplot.exe + Qt 运行库 + 中文翻译（serialplot_zh_CN.qm / qtbase_zh_CN.qm）
            - 解压后直接运行 serialplot.exe，无需安装 Qt
            - 语言：系统区域为中文时自动中文；菜单“语言(Language)”可切中/英；命令行 --lang zh_CN / --lang en
            - 切换语言需重启程序（Qt 翻译器机制限制）
          files: serialplot-zh_CN-portable.zip
          prerelease: false

  sync-to-gitee:
    # 可选步骤：仅在配置了 GITEE_TOKEN 与 GITEE_REPO(secrets) 时，下载/上传步骤才执行；未配置自动跳过，不影响主构建。
    # 注意：secrets 不能在 job 级 if 中使用，故判断放在 step 级。
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        if: ${{ secrets.GITEE_TOKEN != '' && secrets.GITEE_REPO != '' }}
        uses: actions/download-artifact@v4
        with:
          name: serialplot-zh_CN-portable
          path: ./pkg

      - name: 上传到 Gitee Release
        if: ${{ secrets.GITEE_TOKEN != '' && secrets.GITEE_REPO != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          TAG: zh-build-${{ github.run_number }}
        run: |
          set -e
          ZIP="./pkg/serialplot-zh_CN-portable.zip"
          test -f "$ZIP" || { echo "未找到 zip 产物"; exit 1; }
          echo "创建/获取 Gitee Release: $TAG"
          # 创建 release（Gitee API v5，私人令牌通过 access_token 参数鉴权）
          RESP=$(curl -s -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases?access_token=${GITEE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"SerialPlot 中文汉化版 ${TAG}\",\"body\":\"自动同步自 GitHub Actions 构建 ${TAG}\",\"prerelease\":false}")
          echo "$RESP" | head -c 300; echo
          REL_ID=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('id',''))" 2>/dev/null || true)
          if [ -z "$REL_ID" ]; then echo "创建 Gitee Release 失败，跳过同步（请检查 GITEE_TOKEN 权限与 GITEE_REPO 格式 用户名/仓库名）"; exit 0; fi
          echo "Release id=$REL_ID，上传附件 ..."
          curl -s -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/${REL_ID}/attach_files?access_token=${GITEE_TOKEN}" \
            -F "file=@${ZIP}"
          echo
          echo "已同步到 Gitee: https://gitee.com/${GITEE_REPO}/releases"
